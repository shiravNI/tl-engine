  color-scheme: dark;

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))

  padding: var(--visualize-paint-gutter, 0px);
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

:root:not([data-app-block-surface], [data-visualize-standalone]) &gt; body {
  padding: 12px;

  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

/* The shared runtime owns data-tooltip; suppress AppBlock&#x27;s pseudo-tooltip. */
main [data-tooltip]::after {
  content: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);

}

.btn:is(.btn-block, .viz-tile) {

}

  min-width: 0;

  white-space: normal;
}

a.btn {

  text-decoration: none;
}

.btn:not(:disabled):hover,

  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

.nav-link:disabled,
.nav-link[aria-disabled=&quot;true&quot;] {
  cursor: not-allowed;
  opacity: 0.4;

[data-lucide] {

}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {

  padding: 0;

  background-position:

    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;style&gt;
@import url(&#x27;https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600;700&amp;family=Syne:wght@600;700&amp;display=swap&#x27;);

#burnt-y2k-system {
  --espresso: #261814;
  --burnt-umber: #6f3828;
  --rust: #a85132;
  --terracotta: #c77450;
  --clay: #d99b77;
  --sand: #e8cfb4;
  --oat: #f0e2d0;
  --cream: #faf5ec;
  --sage: #8b9071;
  --blush: #d7b4a8;
  --ink: #2c201c;
  --muted-ink: #745f55;
  --line: rgba(80, 48, 35, .16);
  --soft-shadow: 0 18px 45px rgba(79, 43, 28, .10);
  --micro-shadow: 0 5px 0 rgba(38, 24, 20, .12);
  color: var(--ink);
  font-family: &#x27;Manrope&#x27;, sans-serif;
  background: transparent;
}

#burnt-y2k-system * { box-sizing: border-box; }

#burnt-y2k-system .system-shell {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 32px;
  background:
    radial-gradient(circle at 90% 8%, rgba(215,180,168,.45), transparent 25%),
    radial-gradient(circle at 5% 42%, rgba(217,155,119,.25), transparent 24%),
    var(--cream);
  box-shadow: var(--soft-shadow);
}

#burnt-y2k-system .topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 26px;
  border-bottom: 1px solid var(--line);
  background: rgba(250,245,236,.78);
}

#burnt-y2k-system .brand {
  display: flex;
  align-items: center;
  gap: 11px;
  font-family: &#x27;DM Mono&#x27;, monospace;
  font-size: 12px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

#burnt-y2k-system .orb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 25%, #fff7ef 0 8%, var(--clay) 22%, var(--rust) 62%, var(--espresso) 100%);
  box-shadow: inset -3px -3px 8px rgba(38,24,20,.30), 0 0 0 3px rgba(199,116,80,.16);
}

#burnt-y2k-system .version {
  padding: 7px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted-ink);
  font-family: &#x27;DM Mono&#x27;, monospace;
  font-size: 11px;
}

#burnt-y2k-system .hero {
  display: grid;
  grid-template-columns: 1.25fr .75fr;

}

#burnt-y2k-system .hero-copy {
  padding: 68px 54px 58px;
}

#burnt-y2k-system .eyebrow,
#burnt-y2k-system .section-kicker {
  font-family: &#x27;DM Mono&#x27;, monospace;
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--rust);
}

#burnt-y2k-system h1 {
  max-width: 700px;
  margin: 15px 0 18px;
  font-family: &#x27;Syne&#x27;, sans-serif;

  letter-spacing: -.055em;

#burnt-y2k-system .hero-copy p {

}

#burnt-y2k-system .hero-art {

  overflow: hidden;
  border-left: 1px solid var(--line);
  background: linear-gradient(145deg, var(--oat), var(--sand));
}

#burnt-y2k-system .halo {
  position: absolute;
  width: 270px;
  height: 270px;
  top: 58px;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 28%, #fff9f1 0 5%, var(--blush) 18%, var(--terracotta) 47%, var(--burnt-umber) 75%, var(--espresso) 100%);
  box-shadow: inset -28px -26px 48px rgba(38,24,20,.27), 0 26px 55px rgba(111,56,40,.23);
}

#burnt-y2k-system .orbit {
  position: absolute;
  width: 340px;
  height: 105px;
  top: 145px;
  left: 50%;
  transform: translateX(-50%) rotate(-11deg);
  border: 1px solid rgba(250,245,236,.70);
  border-radius: 50%;
}

#burnt-y2k-system .spark { position: absolute; color: var(--cream); font-family: &#x27;DM Mono&#x27;, monospace; }
#burnt-y2k-system .s1 { top: 56px; right: 35px; font-size: 26px; }
#burnt-y2k-system .s2 { left: 28px; bottom: 58px; font-size: 18px; color: var(--rust); }
#burnt-y2k-system .s3 { right: 45px; bottom: 32px; font-size: 12px; color: var(--espresso); }

#burnt-y2k-system .principles {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

#burnt-y2k-system .principle { padding: 24px 28px; }
#burnt-y2k-system .principle + .principle { border-left: 1px solid var(--line); }
#burnt-y2k-system .principle strong { display: block; margin-bottom: 7px; font-family: &#x27;Syne&#x27;, sans-serif; font-size: 18px; }
#burnt-y2k-system .principle span { color: var(--muted-ink); font-size: 13px; line-height: 1.55; }

#burnt-y2k-system section { padding: 52px 42px; }
#burnt-y2k-system section + section { border-top: 1px solid var(--line); }
#burnt-y2k-system .section-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
#burnt-y2k-system h2 { margin: 7px 0 0; font-family: &#x27;Syne&#x27;, sans-serif; font-size: 30px; letter-spacing: -.035em; }
#burnt-y2k-system .section-note { max-width: 410px; color: var(--muted-ink); font-size: 13px; line-height: 1.55; text-align: right; }

#burnt-y2k-system .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
#burnt-y2k-system .swatch { min-width: 0; }
#burnt-y2k-system .swatch-color { height: 100px; border-radius: 20px 20px 7px 7px; border: 1px solid rgba(38,24,20,.09); }
#burnt-y2k-system .swatch-name { margin-top: 9px; font-size: 11px; font-weight: 700; }
#burnt-y2k-system .swatch-code { margin-top: 2px; color: var(--muted-ink); font-family: &#x27;DM Mono&#x27;, monospace; font-size: 10px; }

#burnt-y2k-system .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
#burnt-y2k-system .type-card { padding: 28px; border: 1px solid var(--line); border-radius: 23px; background: rgba(255,255,255,.29); }
#burnt-y2k-system .type-meta { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 24px; color: var(--muted-ink); font-family: &#x27;DM Mono&#x27;, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
#burnt-y2k-system .display-demo { font-family: &#x27;Syne&#x27;, sans-serif; font-size: clamp(32px, 4vw, 54px); line-height: .98; letter-spacing: -.05em; }
#burnt-y2k-system .body-demo { max-width: 500px; font-size: 16px; line-height: 1.65; }
#burnt-y2k-system .mono-demo { margin-top: 25px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--rust); font-family: &#x27;DM Mono&#x27;, monospace; font-size: 12px; letter-spacing: .07em; }

#burnt-y2k-system .component-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 18px; }
#burnt-y2k-system .component-card { padding: 28px; border: 1px solid var(--line); border-radius: 24px; background: var(--oat); }
#burnt-y2k-system .component-label { margin-bottom: 20px; color: var(--muted-ink); font-family: &#x27;DM Mono&#x27;, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
#burnt-y2k-system .button-row { display: flex; flex-wrap: wrap; gap: 10px; }
#burnt-y2k-system button { min-height: 44px; padding: 0 19px; border-radius: 999px; font: 700 13px &#x27;Manrope&#x27;, sans-serif; cursor: pointer; }
#burnt-y2k-system .primary { border: 1px solid var(--espresso); background: var(--espresso); color: var(--cream); box-shadow: var(--micro-shadow); }
#burnt-y2k-system .secondary { border: 1px solid var(--burnt-umber); background: transparent; color: var(--burnt-umber); }

#burnt-y2k-system .icon-button { width: 44px; padding: 0; border: 1px solid var(--line); background: var(--cream); color: var(--rust); }

#burnt-y2k-system .field { display: grid; gap: 8px; margin-bottom: 18px; }
#burnt-y2k-system label { font-size: 12px; font-weight: 700; }
#burnt-y2k-system input { width: 100%; min-height: 48px; padding: 0 16px; border: 1px solid rgba(111,56,40,.28); border-radius: 14px; outline: none; background: var(--cream); color: var(--ink); font: 14px &#x27;Manrope&#x27;, sans-serif; }
#burnt-y2k-system input:focus { border-color: var(--rust); box-shadow: 0 0 0 4px rgba(168,81,50,.12); }
#burnt-y2k-system .chips { display: flex; flex-wrap: wrap; gap: 8px; }
#burnt-y2k-system .chip { padding: 7px 11px; border: 1px solid var(--line); border-radius: 999px; background: rgba(250,245,236,.68); font-family: &#x27;DM Mono&#x27;, monospace; font-size: 10px; }
#burnt-y2k-system .chip.active { border-color: transparent; background: var(--rust); color: var(--cream); }

#burnt-y2k-system .sample-card { position: relative; overflow: hidden; padding: 30px; border-radius: 26px; background: var(--burnt-umber); color: var(--cream); box-shadow: 0 18px 36px rgba(79,43,28,.18); }
#burnt-y2k-system .sample-card:after { content: &#x27;&#x27;; position: absolute; width: 170px; height: 170px; top: -75px; right: -48px; border-radius: 50%; background: radial-gradient(circle at 30% 25%, var(--cream), var(--blush) 20%, var(--terracotta) 48%, var(--espresso)); opacity: .92; }
#burnt-y2k-system .sample-card .tiny { position: relative; z-index: 1; font-family: &#x27;DM Mono&#x27;, monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .75; }
#burnt-y2k-system .sample-card h3 { position: relative; z-index: 1; max-width: 330px; margin: 45px 0 12px; font-family: &#x27;Syne&#x27;, sans-serif; font-size: 34px; line-height: 1.02; letter-spacing: -.04em; }
#burnt-y2k-system .sample-card p { position: relative; z-index: 1; max-width: 370px; margin: 0 0 22px; color: var(--sand); font-size: 13px; line-height: 1.6; }

#burnt-y2k-system .rule p { margin: 0; color: var(--muted-ink); font-size: 12px; line-height: 1.55; }
#burnt-y2k-system .yes b:before { content: &#x27;✓&#x27;; margin-right: 8px; color: var(--sage); }
#burnt-y2k-system .no b:before { content: &#x27;×&#x27;; margin-right: 8px; color: var(--rust); }

#burnt-y2k-system .tokens { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
#burnt-y2k-system .token { padding: 20px; border: 1px solid var(--line); border-radius: 18px; background: rgba(250,245,236,.63); }
#burnt-y2k-system .token span { display: block; color: var(--muted-ink); font-family: &#x27;DM Mono&#x27;, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .09em; }

#burnt-y2k-system .footer { display: flex; justify-content: space-between; gap: 20px; padding: 24px 42px; border-top: 1px solid var(--line); color: var(--muted-ink); font-family: &#x27;DM Mono&#x27;, monospace; font-size: 10px; }

@media (max-width: 760px) {
  #burnt-y2k-system .hero { grid-template-columns: 1fr; }
  #burnt-y2k-system .hero-copy { padding: 48px 28px 40px; }

  #burnt-y2k-system .principles { grid-template-columns: 1fr; }

  #burnt-y2k-system .swatches { grid-template-columns: repeat(4, 1fr); }
  #burnt-y2k-system .type-grid,
  #burnt-y2k-system .component-grid,
  #burnt-y2k-system .rules-grid { grid-template-columns: 1fr; }
  #burnt-y2k-system .tokens { grid-template-columns: 1fr 1fr; }

@media (max-width: 420px) {
  #burnt-y2k-system .topbar { padding: 15px 18px; }
  #burnt-y2k-system .system-shell { border-radius: 22px; }
  #burnt-y2k-system .swatches { grid-template-columns: 1fr 1fr; }
  #burnt-y2k-system .swatch-color { height: 74px; }
  #burnt-y2k-system .tokens { grid-template-columns: 1fr; }
  #burnt-y2k-system .footer { padding: 22px 24px; flex-direction: column; }
}

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;

    const panelId = selected.getAttribute(&quot;aria-controls&quot;);

      const active = tab === selected;

      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);

      return;

      return;
    }

      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));

      next = (current + 1) % tabs.length;

      next = (current + tabs.length - 1) % tabs.length;

      next = 0;
